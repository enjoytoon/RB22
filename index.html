<script>
(function(){
'use strict';
var FAST=/(^|[?&])fast/.test(location.search);
var BET_MS=FAST?4000:15000, SPIN_MS=FAST?3000:15000;
var SUSPENSE=1000;
var KEY='redblack-v1', UNIT=5, HKEEP=30, HSHOW=14, MAXSTEPS=12;
var TAGS=['100%','++','+','?','??','M','MM','єЦіль'];
var REDS={1:1,3:1,5:1,7:1,9:1,12:1,14:1,16:1,18:1,19:1,21:1,23:1,25:1,27:1,30:1,32:1,34:1,36:1};
function colorOf(n){return n===0?'g':(REDS[n]?'r':'b');}
function rnd37(){return Math.floor(Math.random()*37);}
function fmt(n){
  var s=String(Math.round(Math.abs(n)));
  var out=s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n<0?'−':'')+out;
}
function ukr(n,one,few,many){var a=n%10,b=n%100;if(a===1&&b!==11)return one;if(a>=2&&a<=4&&(b<10||b>=20))return few;return many;}
function $(id){return document.getElementById(id);}
function pct(w,n){return n?Math.round(w/n*100)+'%':'—';}
function wordFor(c){return c==='r'?'ЧЕРВОНЕ':(c==='b'?'ЧОРНЕ':'ЗЕРО');}

/* ---- план ставок: як у «Трьох столах» — кратність 5, каскад залишку ---- */
function planFor(balance,wantSteps){
  var n,base,factor,bets,rem,k,j,t,cost;
  for(n=Math.min(MAXSTEPS,Math.max(1,wantSteps));n>=1;n--){
    factor=(1<<n)-1;
    base=Math.floor(balance/factor/UNIT)*UNIT;
    if(base<UNIT)continue;
    bets=[];
    for(k=0;k<n;k++)bets.push(base<<k);
    rem=balance-base*factor;
    for(k=0;k<n;k++){
      cost=UNIT*((1<<(n-k))-1);
      t=Math.floor(rem/cost);
      if(t>0){
        for(j=k;j<n;j++)bets[j]+=UNIT*t*(1<<(j-k));
        rem-=t*cost;
      }
    }
    return {bets:bets,committed:balance-rem,leftover:rem,steps:n,reduced:n<wantSteps};
  }
  return null;
}

/* ---- стан ---- */
function seedHist(){var a=[],i;for(i=0;i<HSHOW;i++)a.push(rnd37());return a;}
function zeros(){var a=[],i;for(i=0;i<MAXSTEPS;i++)a.push(0);return a;}
function freshBucket(){return {byStep:zeros(),losses:0};}
function freshStats(){return {real:{n:0,w:0},fake:{n:0,w:0},byStep:zeros(),busts:0,profit:0,maxBal:310,million:false,tags:{},untag:freshBucket()};}
function defaults(){return {v:1,balance:310,steps:5,startBal:310,betAmt:'big',
  def:{balance:310,steps:5},
  plan:null,step:0,dbl:false,
  hist:seedHist(),log:[],
  phase:'bet',phaseEnd:Date.now()+BET_MS,
  last:null,revealAt:0,tagSel:null,stats:freshStats()};}
function num(x,d){return (typeof x==='number'&&isFinite(x))?x:d;}
function validPlan(p){
  return !!(p&&typeof p==='object'
    &&typeof p.steps==='number'&&p.steps>=1&&p.steps<=MAXSTEPS
    &&Array.isArray(p.bets)&&p.bets.length===p.steps&&p.bets.every(function(x){return typeof x==='number'&&x>0;})
    &&typeof p.committed==='number');
}
function validWL(g){return !!(g&&typeof g==='object'&&typeof g.n==='number'&&typeof g.w==='number');}
function validBucket(g){return !!(g&&typeof g==='object'&&Array.isArray(g.byStep)&&typeof g.losses==='number');}
function copyBucket(g){
  var b=freshBucket(),k;
  for(k=0;k<MAXSTEPS;k++)b.byStep[k]=Math.max(0,Math.round(num(g.byStep[k],0)));
  b.losses=Math.max(0,Math.round(num(g.losses,0)));
  return b;
}
function load(){
  var d=null,S=defaults();
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!d||typeof d!=='object')return S;
  S.balance=Math.max(0,Math.round(num(d.balance,310)));
  S.steps=Math.min(MAXSTEPS,Math.max(1,Math.round(num(d.steps,5))));
  S.betAmt=(d.betAmt==='small'||d.betAmt==='off')?d.betAmt:'big';
  if(d.def&&typeof d.def==='object'){
    S.def.steps=Math.min(MAXSTEPS,Math.max(1,Math.round(num(d.def.steps,5))));
  }
  S.def.balance=310; /* стандарт 310 і крапка — суму міняє тільки гра */
  S.startBal=310;
  if(validPlan(d.plan))S.plan=d.plan;
  S.step=Math.max(0,Math.round(num(d.step,0)));
  if(!S.plan||S.step>=S.plan.steps){S.plan=null;S.step=0;}
  S.dbl=!!d.dbl;
  if(Array.isArray(d.hist)&&d.hist.length>0&&d.hist.every(function(x){return typeof x==='number'&&x>=0&&x<=36;}))S.hist=d.hist.slice(0,HKEEP);
  if(Array.isArray(d.log))S.log=d.log.filter(function(L){
    return L&&typeof L==='object'&&typeof L.n==='number'&&L.n>=0&&L.n<=36
      &&(L.bet==='r'||L.bet==='b')&&typeof L.hit==='boolean'
      &&typeof L.delta==='number'&&typeof L.bal==='number';
  }).slice(0,100);
  if(d.phase==='spin')S.phase='spin';
  S.phaseEnd=num(d.phaseEnd,Date.now()+BET_MS);
  if(d.last&&typeof d.last==='object'&&typeof d.last.n==='number'&&d.last.n>=0&&d.last.n<=36)S.last=d.last;
  S.revealAt=num(d.revealAt,0);
  S.tagSel=TAGS.indexOf(d.tagSel)>=0?d.tagSel:null;
  if(d.stats&&typeof d.stats==='object'){
    var st=S.stats;
    if(validWL(d.stats.real))st.real={n:Math.round(d.stats.real.n),w:Math.round(d.stats.real.w)};
    if(validWL(d.stats.fake))st.fake={n:Math.round(d.stats.fake.n),w:Math.round(d.stats.fake.w)};
    if(Array.isArray(d.stats.byStep))for(var bi=0;bi<MAXSTEPS;bi++)st.byStep[bi]=Math.max(0,Math.round(num(d.stats.byStep[bi],0)));
    st.busts=Math.max(0,Math.round(num(d.stats.busts,0)));
    st.profit=num(d.stats.profit,0);
    st.maxBal=Math.max(S.balance,num(d.stats.maxBal,S.balance));
    st.million=!!d.stats.million;
    if(validBucket(d.stats.untag))st.untag=copyBucket(d.stats.untag);
    if(d.stats.tags&&typeof d.stats.tags==='object'){
      TAGS.forEach(function(tg){
        if(validBucket(d.stats.tags[tg]))st.tags[tg]=copyBucket(d.stats.tags[tg]);
      });
    }
  }
  return S;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

var revealShown=!S.revealAt||Date.now()>=S.revealAt;
var pendMillion=false;
var popAt=0;
var snap=null; /* що показувати, поки крутиться: старий баланс, щоб не спалити результат */
var balPreview=false; /* тап по балансу: показати суму, ЯКЩО виграю поточну ставку */
function inSuspense(){return !!(S.revealAt&&Date.now()<S.revealAt);}
function pushHist(n){S.hist.unshift(n);if(S.hist.length>HKEEP)S.hist.length=HKEEP;}

/* ---- ставка: миттєвий результат; мітка (tagSel) живе весь сет ---- */
function setBucket(){
  if(S.tagSel){
    var g=S.stats.tags[S.tagSel];
    if(!g)g=S.stats.tags[S.tagSel]=freshBucket();
    return g;
  }
  return S.stats.untag;
}
function doBet(color,mode,dbl){
  var amount=0,double=false;
  if(mode==='real'){
    if(!S.plan){
      var pl=planFor(S.balance,S.steps);
      if(!pl){toast('Замало грошей — тапни ↺ двічі, почнеш з 310 ₴','bad');return;}
      S.plan=pl;S.step=0;
    }
    S.dbl=false;
    double=!!dbl&&(S.plan.steps-S.step)>=2;
    amount=S.plan.bets[S.step]+(double?S.plan.bets[S.step+1]:0);
  }else{
    var pv=S.plan||planFor(S.balance,S.steps);
    amount=pv?pv.bets[Math.min(S.step,pv.steps-1)]:0;
  }
  /* до розіграшу — щоб ні баланс, ні історія не видали результат раніше за цифру */
  balPreview=false;
  snap={bal:S.balance,hideHist:1};
  var n=rnd37();
  pushHist(n);
  var hit=colorOf(n)===color;
  var delta=0,bust=false,stepFrom=S.step,stepsTotal=S.plan?S.plan.steps:S.steps;
  if(mode==='real'){
    if(hit){
      delta=amount;S.balance+=amount;
      S.plan=null;S.step=0;
    }else{
      delta=-amount;S.balance-=amount;
      S.step+=double?2:1;
      if(S.step>=S.plan.steps){bust=true;S.plan=null;S.step=0;}
    }
    S.stats.real.n++;
    if(hit){
      /* сет завершено виграшем: мітка сету рахує, з якого разу вгадав */
      S.stats.real.w++;
      S.stats.byStep[Math.min(stepFrom,MAXSTEPS-1)]++;
      setBucket().byStep[Math.min(stepFrom,MAXSTEPS-1)]++;
      S.tagSel=null;
    }else if(bust){
      /* сет програно повністю: мітці сету пишеться програш */
      S.stats.busts++;
      setBucket().losses++;
      S.tagSel=null;
    }
    S.stats.profit+=delta;
    if(S.balance>S.stats.maxBal)S.stats.maxBal=S.balance;
    if(S.balance>=1000000&&!S.stats.million){S.stats.million=true;pendMillion=true;}
  }else{
    S.stats.fake.n++;if(hit)S.stats.fake.w++;
  }
  S.log.unshift({n:n,bet:color,mode:mode,hit:hit,delta:mode==='real'?delta:0,bal:S.balance});
  if(S.log.length>100)S.log.length=100;
  S.last={n:n,kind:'bet',betColor:color,mode:mode,hit:hit,amount:amount,delta:delta,
    bust:bust,double:double,stepFrom:stepFrom+1,
    stepDone:stepFrom+(double?2:1),stepsTotal:stepsTotal};
  S.revealAt=Date.now()+SUSPENSE;
  revealShown=false;
  S.phase='bet';
  S.phaseEnd=S.revealAt+BET_MS;
  save();render();
}
function tapBet(color,mode){
  if(inSuspense())return;
  if(S.phase==='spin'){
    /* ставки закриті — просто кажемо про це, нічого не чергуємо */
    toast('Ставки закрито','info');
    return;
  }
  doBet(color,mode,mode==='real'&&S.dbl);
}
function adjustSteps(d){
  if(inSuspense())return;
  if(S.plan){toast('Сет активний — заверши його або натисни «Стоп сет»','info');return;}
  S.steps=Math.min(MAXSTEPS,Math.max(1,S.steps+d));
  save();render();
}
function stopSet(){
  if(inSuspense())return;
  if(!S.plan){toast('Сет і так не активний','info');return;}
  /* сума, що лишилась, стає банком нового сету; в статистику нічого не пишемо */
  S.plan=null;S.step=0;S.dbl=false;S.tagSel=null;
  save();render();
  toast('Сет зупинено — граєш далі з '+fmt(S.balance)+' ₴','info');
}
function skipRound(){
  if(inSuspense())return;
  if(S.phase==='spin'){
    S.phaseEnd=Math.min(S.phaseEnd,Date.now()+400);
    return;
  }
  snap={bal:S.balance,hideHist:1};
  var n=rnd37();
  pushHist(n);
  S.last={n:n,kind:'skip'};
  S.revealAt=Date.now()+600;
  revealShown=false;
  S.phase='bet';
  S.phaseEnd=S.revealAt+BET_MS;
  save();render();
}

/* ---- фоновий ритм казино ---- */
function catchUp(){
  var changed=false,spins=0,maxDur=Math.max(BET_MS,SPIN_MS);
  if(S.phaseEnd-Date.now()>maxDur+SUSPENSE+60000){
    S.phaseEnd=Date.now()+(S.phase==='bet'?BET_MS:SPIN_MS);changed=true;
  }
  while(Date.now()>=S.phaseEnd&&spins<220){
    if(S.phase==='bet'){S.phase='spin';S.phaseEnd+=SPIN_MS;}
    else{
      pushHist(rnd37());
      popAt=Date.now();
      S.last={n:S.hist[0],kind:'idle'};
      S.phase='bet';S.phaseEnd+=BET_MS;spins++;
    }
    changed=true;
    if(spins>=10&&Date.now()>=S.phaseEnd){
      S.phase='bet';S.phaseEnd=Date.now()+BET_MS;
      break;
    }
  }
  if(changed){save();render();}
}

/* ---- рендер ---- */
function render(){
  $('stVal').textContent=S.steps;
  var showBal=(inSuspense()&&snap)?snap.bal:S.balance;
  var previewOn=false;
  if(balPreview&&!inSuspense()){
    var ppl=S.plan||planFor(S.balance,S.steps);
    if(ppl){
      var pk=Math.min(S.step,ppl.steps-1);
      var pw=ppl.bets[pk]+((S.dbl&&(ppl.steps-S.step)>=2)?ppl.bets[pk+1]:0);
      showBal=S.balance+pw;
      previewOn=true;
    }
  }
  var balStr=fmt(showBal);
  $('bal').textContent=balStr;
  $('bal').classList.toggle('long',balStr.length>=7); /* довгі суми — трохи менший шрифт, щоб в один рядок */
  $('bal').classList.toggle('prev',previewOn);
  if(previewOn){
    $('rec').innerHTML='<b class="ok">якщо виграю ставку</b>';
  }else{
    var diff=showBal-S.startBal;
    var sign=diff>=0?'+':'−';
    var pctTxt=S.startBal>0?' · '+sign+Math.round(Math.abs(diff)/S.startBal*100)+'%':'';
    $('rec').innerHTML='<b class="'+(diff>=0?'ok':'bad')+'">'+sign+fmt(Math.abs(diff))+' ₴'+pctTxt+'</b>';
  }
  renderBig();
  renderHist();
  renderLadder();
  renderControls();
  renderTags();
  renderTimer();
}
function renderBig(){
  /* три зони з фіксованою висотою — жодних стрибків лейауту */
  var sus=inSuspense(),slot,word='',res='';
  if(sus){
    slot='<div class="wheelBig"></div>';
  }else if(S.phase==='spin'){
    slot='<div class="dotsBig"><i></i><i></i><i></i></div>';
    res='<span class="bigSub">Ставки закрито</span>';
  }else{
    var L=S.last,n=L?L.n:S.hist[0];
    var pop=(Date.now()-popAt<1500)?' pop':'';
    slot='<div class="bigNum '+colorOf(n)+pop+'">'+n+'</div>';
    word=wordFor(colorOf(n));
    if(L&&L.kind==='bet')res=L.hit?'<span class="rOk">✓</span>':'<span class="rBad">✗</span>';
    else if(L&&L.kind==='skip')res='<span class="bigSub">пропущено</span>';
  }
  $('big').innerHTML='<div class="bslot">'+slot+'</div>'
    +'<div class="bword">'+word+'</div>'
    +'<div class="bres">'+res+'</div>';
}
function renderHist(){
  /* поки крутиться — свіже число в історії не показуємо, щоб не спалити результат */
  var off=(inSuspense()&&snap&&snap.hideHist)?snap.hideHist:0;
  var html='',hh=S.hist.slice(off,off+HSHOW),i;
  for(i=0;i<hh.length;i++)html+='<span class="hq '+colorOf(hh[i])+'">'+hh[i]+'</span>';
  $('histRow').innerHTML=html;
}
function renderLadder(){
  /* поки крутиться — не оновлюємо, щоб драбина не видала результат */
  if(inSuspense()&&$('ladder').innerHTML!=='')return;
  /* завжди рівно два рядки — щоб кнопки під драбиною не стрибали */
  var l1,l2;
  if(S.plan){
    l1='Крок <b>'+(S.step+1)+' з '+S.plan.steps+'</b> · ставка <b>'+fmt(S.plan.bets[S.step])+' ₴</b> · лишилось '+(S.plan.steps-S.step);
    l2='План: '+S.plan.bets.map(fmt).join(' → ');
  }else{
    var pl=planFor(S.balance,S.steps);
    if(pl){
      l1='Ставка: <b>'+fmt(pl.bets[0])+' ₴</b> · банк '+fmt(pl.committed)+' ₴'
        +(pl.reduced?' · <span class="warn">'+pl.steps+' '+ukr(pl.steps,'крок','кроки','кроків')+'</span>':'');
      l2='План: '+pl.bets.map(fmt).join(' → ');
    }else{
      l1='<span class="warn">Замало грошей — тапни ↺ двічі, почнеш знову з 310 ₴</span>';
      l2='Фейкові ставки можна завжди';
    }
  }
  $('ladder').innerHTML=l1+'<br>'+l2;
}
function renderControls(){
  if(inSuspense()&&$('amtRed').textContent!=='')return;
  var pl=S.plan||planFor(S.balance,S.steps);
  var k=pl?Math.min(S.step,pl.steps-1):0;
  var canDbl=!!pl&&(pl.steps-S.step)>=2;
  if(!canDbl&&S.dbl)S.dbl=false;
  /* колір видно з самої кнопки — великими пишемо суму ставки */
  var amt,sub;
  if(!pl){amt='—';sub='нема грошей';}
  else if(S.dbl){amt=fmt(pl.bets[k]+pl.bets[k+1])+' ₴';sub='×2';}
  else{amt=fmt(pl.bets[k])+' ₴';sub='';}
  if(S.betAmt==='off'){
    /* суму сховано — повертаємо слова, колір і так видно з кнопки */
    $('amtRed').textContent='ЧЕРВОНЕ';
    $('amtBlack').textContent='ЧОРНЕ';
  }else{
    $('amtRed').textContent=amt;
    $('amtBlack').textContent=amt;
  }
  $('betRow').classList.toggle('small',S.betAmt==='small');
  $('subRed').textContent=sub;
  $('subBlack').textContent=sub;
  var b=$('btnDbl');
  b.classList.toggle('on',S.dbl);
  b.classList.toggle('off',!canDbl);
  $('btnStop').classList.toggle('off',!S.plan);
  $('dblSub').textContent=!canDbl
    ?'недоступно'
    :(S.dbl
      ?(fmt(pl.bets[S.step])+'+'+fmt(pl.bets[S.step+1])+' = '+fmt(pl.bets[S.step]+pl.bets[S.step+1])+' ₴')
      :'два кроки за раз');
}
function renderTags(){
  var html='<span class="tagLbl">Мітка:</span>',i;
  for(i=0;i<TAGS.length;i++){
    html+='<button class="tag'+(S.tagSel===TAGS[i]?' on':'')+'" data-tag="'+TAGS[i]+'">'+TAGS[i]+'</button>';
  }
  $('tagRow').innerHTML=html;
}
function renderTimer(){
  var lbl,secTxt,fill;
  if(inSuspense()){
    lbl='Дивимось результат…';secTxt='';fill=100;
    document.body.classList.add('spinPhase');
  }else if(S.phase==='spin'){
    /* ставки закриті: повна червона смуга, без зворотного відліку */
    lbl='Ставки закрито';secTxt='';fill=100;
    document.body.classList.add('spinPhase');
  }else{
    var left=Math.max(0,S.phaseEnd-Date.now());
    lbl='Ставки відкрито';
    secTxt=Math.ceil(left/1000)+'с';
    fill=Math.max(0,Math.min(100,left/BET_MS*100));
    document.body.classList.remove('spinPhase');
  }
  $('phSec').textContent=secTxt;
  $('phFill').style.width=fill+'%';
  if($('phLbl').textContent!==lbl)$('phLbl').textContent=lbl;
}
function revealFx(){
  var L=S.last;
  if(!L||L.kind!=='bet')return;
  popAt=Date.now();
  /* без слів: тільки ✓/✗ на екрані, конфеті на реальному виграші */
  if(L.mode==='real'&&L.hit)confetti(16);
  if(pendMillion){
    pendMillion=false;
    setTimeout(function(){toast('🏆 МІЛЬЙОН! ТИ ЗРОБИВ ЦЕ! 🏆','gold');confetti(140);},1200);
  }
}

/* ---- тост і конфеті ---- */
var toastTmr=null;
function toast(txt,kind){
  var el=$('toast');
  el.textContent=txt;
  el.className='on '+(kind||'info');
  clearTimeout(toastTmr);
  toastTmr=setTimeout(function(){el.className='';},3000);
}
function confetti(nn){
  var fx=$('fx');fx.innerHTML='';
  var colors=['#e94560','#ffd166','#2dd4a7','#4cc9f0','#f5f5ff'];
  for(var i=0;i<nn;i++){
    var s=document.createElement('i');
    s.style.left=(Math.random()*100)+'%';
    s.style.background=colors[i%colors.length];
    var sz=Math.floor(6+Math.random()*7);
    s.style.width=sz+'px';s.style.height=Math.max(4,Math.floor(sz*0.55))+'px';
    s.style.animationDelay=(Math.random()*0.5)+'s';
    s.style.animationDuration=(2.1+Math.random()*1.6)+'s';
    s.style.setProperty('--r',Math.floor(Math.random()*720-360)+'deg');
    fx.appendChild(s);
  }
  setTimeout(function(){fx.innerHTML='';},4400);
}

/* ---- модалки ---- */
function syncSettings(){
  $('vSteps').textContent=S.steps;
  var sa=$('segAmt').children,si;
  for(si=0;si<sa.length;si++)sa[si].classList.toggle('on',sa[si].getAttribute('data-v')===S.betAmt);
  var pl=planFor(S.balance,S.steps);
  $('planPrev').innerHTML=pl
    ?('План на зараз: '+pl.bets.map(fmt).join(' → ')+'<br>разом '+fmt(pl.committed)+' ₴ · залишок '+fmt(pl.leftover)+' ₴'
      +(pl.reduced?' · <span class="warn">вистачає лише на '+pl.steps+' '+ukr(pl.steps,'крок','кроки','кроків')+'</span>':''))
    :'Замало грошей навіть на одну ставку 😢';
  $('defLine').textContent='Дефолт: '+fmt(S.def.balance)+' ₴ · '+S.def.steps+' '
    +ukr(S.def.steps,'крок','кроки','кроків')+' — кнопка ↺ вгорі повертає до цього';
}
function syncStats(){
  var s=S.stats,k;
  var totN=s.real.n+s.fake.n,totW=s.real.w+s.fake.w;
  var setW=0;
  for(k=0;k<MAXSTEPS;k++)setW+=s.byStep[k];
  $('stTop').innerHTML=
    '<div class="stBig">Вгадувань усього: <b>'+totN+'</b> · вгадав: <b class="ok">'+totW+'</b> · <b>'+pct(totW,totN)+'</b></div>'
   +'<div class="stBig">💰 Реальні: <b>'+s.real.n+'</b> · вгадав <b class="ok">'+s.real.w+'</b> ('+pct(s.real.w,s.real.n)+')'
   +' · разом: <b class="'+(s.profit>=0?'ok':'bad')+'">'+(s.profit>=0?'+':'')+fmt(s.profit)+' ₴</b></div>'
   +'<div class="stBig">🎈 Фейкові: <b>'+s.fake.n+'</b> · вгадав <b class="ok">'+s.fake.w+'</b> ('+pct(s.fake.w,s.fake.n)+')</div>'
   +'<div class="stBig">Сетів: вгадано <b class="ok">'+setW+'</b> · програно повністю <b class="bad">'+s.busts+'</b></div>'
   +'<div class="stBig">Рекорд рахунку: <b>'+fmt(s.maxBal)+' ₴</b></div>';
  var sr='',mx=1,si;
  for(si=0;si<MAXSTEPS;si++)if(s.byStep[si]>mx)mx=s.byStep[si];
  for(si=0;si<MAXSTEPS;si++){
    if(s.byStep[si]>0||si<S.steps){
      sr+='<div class="stRow"><span class="stL">з '+(si+1)+'-го разу</span>'
        +'<span class="stBar"><i style="width:'+(s.byStep[si]/mx*100)+'%"></i></span><b>'+s.byStep[si]+'</b></div>';
    }
  }
  $('stSteps').innerHTML=sr||'<div class="stEmpty">Ще нема виграшів</div>';
  function bucketTxt(g){
    var parts=[],j;
    for(j=0;j<MAXSTEPS;j++)if(g.byStep[j]>0)parts.push('з '+(j+1)+'-го — <b class="ok">'+g.byStep[j]+'</b>');
    if(g.losses>0)parts.push('<b class="bad">✗ програно '+g.losses+'</b>');
    return parts.join(' · ');
  }
  function hasData(g){
    if(!g||g.losses>0)return !!g;
    for(var j=0;j<MAXSTEPS;j++)if(g.byStep[j]>0)return true;
    return false;
  }
  var th='';
  TAGS.forEach(function(tg){
    var g=s.tags[tg];
    if(!hasData(g))return;
    th+='<div class="stRow"><b class="tagChip">'+tg+'</b>'
      +'<span class="tagTxt">'+bucketTxt(g)+'</span></div>';
  });
  if(hasData(s.untag)){
    th+='<div class="stRow"><b class="tagChip">без</b>'
      +'<span class="tagTxt">'+bucketTxt(s.untag)+'</span></div>';
  }
  $('stTags').innerHTML=th||'<div class="stEmpty">Мітка чіпляється до ВСЬОГО сету (до виграшу чи повного програшу) і рахує, з якого разу вгадав</div>';
  var lh='',lo=(inSuspense()&&snap)?1:0,li,LG;
  var arr=S.log.slice(lo,lo+50);
  for(li=0;li<arr.length;li++){
    LG=arr[li];
    lh+='<div class="logRow">'
      +'<span class="lq '+colorOf(LG.n)+'">'+LG.n+'</span>'
      +'<span>на <i class="dot '+(LG.bet==='r'?'r':'b')+'"></i></span>'
      +'<span class="'+(LG.hit?'logOk':'logBad')+'">'+(LG.hit?'✓':'✗')+'</span>'
      +(LG.mode==='real'
        ?'<span class="'+(LG.delta>=0?'logOk':'logBad')+'">'+(LG.delta>=0?'+':'−')+fmt(Math.abs(LG.delta))+' ₴</span>'
          +'<span class="logBal">'+fmt(LG.bal)+' ₴</span>'
        :'<span class="logFake">фейк</span>')
      +'</div>';
  }
  $('stLog').innerHTML=lh||'<div class="stEmpty">Ще нема ставок</div>';
}
function armConfirm(btn,fn){
  if(btn.dataset.armed){
    delete btn.dataset.armed;
    btn.textContent=btn.dataset.label;
    fn();
  }else{
    btn.dataset.armed='1';
    btn.dataset.label=btn.textContent;
    btn.textContent='Точно?';
    setTimeout(function(){
      if(btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.label;}
    },2600);
  }
}
function resetLadder(){S.plan=null;S.step=0;}

/* ---- обробники ---- */
$('btnRed').addEventListener('click',function(){tapBet('r','real');});
$('btnBlack').addEventListener('click',function(){tapBet('b','real');});
$('btnFakeRed').addEventListener('click',function(){tapBet('r','fake');});
$('btnFakeBlack').addEventListener('click',function(){tapBet('b','fake');});
$('btnSkip').addEventListener('click',skipRound);
$('btnStop').addEventListener('click',stopSet);
$('stMinus').addEventListener('click',function(){adjustSteps(-1);});
$('stPlus').addEventListener('click',function(){adjustSteps(1);});
$('balRow').addEventListener('click',function(){
  if(inSuspense())return;
  balPreview=!balPreview;
  render();
});
$('btnDbl').addEventListener('click',function(){
  var pl=S.plan||planFor(S.balance,S.steps);
  if(!pl||(pl.steps-S.step)<2){toast('×2 недоступно — це останній крок драбини','info');return;}
  S.dbl=!S.dbl;
  save();renderControls();
});
$('segAmt').addEventListener('click',function(e){
  var b=e.target;
  while(b&&b!==this&&b.tagName!=='BUTTON')b=b.parentNode;
  if(!b||b===this)return;
  S.betAmt=b.getAttribute('data-v');
  save();renderControls();syncSettings();
});
$('tagRow').addEventListener('click',function(e){
  var b=e.target;
  while(b&&b!==this&&!(b.classList&&b.classList.contains('tag')))b=b.parentNode;
  if(!b||b===this)return;
  var tg=b.getAttribute('data-tag');
  S.tagSel=S.tagSel===tg?null:tg;
  save();renderTags();
});
var qrArm=0;
$('btnQuickReset').addEventListener('click',function(){
  if(inSuspense())return;
  var now=Date.now();
  if(now-qrArm<3000){
    qrArm=0;
    S.balance=S.def.balance;S.steps=S.def.steps;S.startBal=S.def.balance;
    resetLadder();S.last=null;S.dbl=false;S.revealAt=0;revealShown=true;S.tagSel=null;snap=null;
    if(S.balance>S.stats.maxBal)S.stats.maxBal=S.balance;
    save();render();
    toast('↺ Скинуто: '+fmt(S.balance)+' ₴ · '+S.steps+' '+ukr(S.steps,'крок','кроки','кроків'),'good');
  }else{
    qrArm=now;
    toast('Тапни ↺ ще раз — поверну дефолт ('+fmt(S.def.balance)+' ₴)','info');
  }
});
$('btnSaveDef').addEventListener('click',function(){
  S.def={balance:310,steps:S.steps};
  save();syncSettings();
  toast('Дефолт збережено: '+S.def.steps+' '+ukr(S.def.steps,'крок','кроки','кроків')+' (рахунок завжди 310 ₴)','good');
});
$('btnSettings').addEventListener('click',function(){syncSettings();$('modalSet').classList.remove('hidden');});
$('btnCloseSet').addEventListener('click',function(){$('modalSet').classList.add('hidden');});
$('modalSet').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
$('btnStats').addEventListener('click',function(){syncStats();$('modalStats').classList.remove('hidden');});
$('btnCloseStats').addEventListener('click',function(){$('modalStats').classList.add('hidden');});
$('modalStats').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});
$('sMinus').addEventListener('click',function(){adjustSteps(-1);syncSettings();});
$('sPlus').addEventListener('click',function(){adjustSteps(1);syncSettings();});
$('btnResetStats').addEventListener('click',function(){
  armConfirm(this,function(){
    var keepMax=S.balance;
    S.stats=freshStats();
    S.stats.maxBal=keepMax;
    S.last=null;
    S.log=[];
    save();render();
    toast('Статистику скинуто','info');
  });
});
$('btnResetAll').addEventListener('click',function(){
  armConfirm(this,function(){
    S=defaults();
    revealShown=true;
    snap=null;
    save();render();syncSettings();
    toast('Гру скинуто — рахунок 310 ₴','info');
  });
});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){if(!document.hidden){catchUp();renderTimer();}});

/* ---- старт ---- */
window.DBG={planFor:planFor,get state(){return S;},catchUp:catchUp,doBet:doBet,save:save,render:render};
catchUp();
render();
setInterval(function(){
  catchUp();
  if(S.revealAt&&!revealShown&&Date.now()>=S.revealAt){
    revealShown=true;
    snap=null; /* тепер можна показати новий баланс — разом із цифрою */
    revealFx();
    render();
  }
  renderTimer();
},250);
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
